      if (gap.a - a > 0.15) segs.push([a, gap.a]); if (b - gap.b > 0.15) segs.push([gap.b, b]);
    } else segs.push(e[0] === 'z' ? [pts[0][0], pts[1][0]] : [pts[0][1], pts[1][1]]);
    for (const [a, b] of segs) {
      const p = e[0] === 'z' ? [[a, pts[0][1]], [b, pts[0][1]]] : [[pts[0][0], a], [pts[0][0], b]];
      const n = Math.max(1, Math.round(Math.abs(b - a) / 0.12));
      let first = null, last = null;
      for (let i = 0; i <= n; i++) {
        const t = i / n, xx = p[0][0] + (p[1][0] - p[0][0]) * t, zz = p[0][1] + (p[1][1] - p[0][1]) * t;
        if (!fits(xx, zz)) continue;
        box('mezz', M.post, xx - 0.015, xx + 0.015, y, y + 0.92, zz - 0.015, zz + 0.015);
        if (!first) first = [xx, zz]; last = [xx, zz];
      }
      if (first && last && (first[0] !== last[0] || first[1] !== last[1])) beam('mezz', M.post, V3(first[0], y + 0.95, first[1]), V3(last[0], y + 0.95, last[1]), 0.05, 0.08);
    }
  }
  PLAN.mezz.push({ x0, x1, z0, z1 });
}

   ========================================================= */
function cssLabel(cls, html, p, group) {
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html;
  const o = new CSS2DObject(el); o.position.copy(p); G[group].add(o); return o;
}
function dim(a, b, text) {
  const A = V3(...a), B = V3(...b);
  const d = B.clone().sub(A).normalize();
  let perp = d.clone().cross(UPV); if (perp.lengthSq() < 0.01) perp = V3(1, 0, 0);
  perp.normalize().multiplyScalar(0.12);
  const g = new THREE.BufferGeometry().setFromPoints([A, B, A.clone().add(perp), A.clone().sub(perp), B.clone().add(perp), B.clone().sub(perp)]);
  const l = new THREE.LineSegments(g, M.dimLine); l.renderOrder = 9; l.userData.dir = d; G.dims.add(l);
  cssLabel('cota', text, A.clone().add(B).multiplyScalar(0.5), 'dims').userData.dir = d;
}
function mat(p, text) { cssLabel('mlab', '<i></i>' + text, V3(...p), 'mats'); }
function room(n, x0, x1, z0, z1, opts = {}) { PLAN.rooms.push({ n, x0, x1, z0, z1, a: opts.a ?? (x1 - x0) * (z1 - z0), lx: opts.lx, lz: opts.lz }); }
/* luzes internas: um conjunto fixo de 6 pontos reaproveitado em todos os modelos (troca de modelo sem recompilar sombreadores) */
const LPOOL = Array.from({ length: 6 }, () => { const l = new THREE.PointLight(0xffd9a6, 0, 8, 2); l.position.set(0, -50, 0); scene.add(l); return l; });
let LREQ = [];
function light(x, y, z, k = 1) { LREQ.push([x, y, z, k]); }
function placeLights() {
  LREQ.sort((a, b) => b[3] - a[3]);
  LPOOL.forEach((l, i) => { const r = LREQ[i]; if (r) { l.position.set(r[0], r[1], r[2]); l.intensity = 5.5 * r[3]; } else { l.intensity = 0; l.position.set(0, -50, 0); } });
  LREQ = [];
}

/* =========================================================
   ENTORNO (árvores)
   ========================================================= */
function tree(x, z, s, kind = 'copa') {
  const y = groundAt(x, z);
  if (kind === 'pinheiro') {
    cyl('site', M.bark, V3(x, y, z), V3(x, y + 2.2 * s, z), 0.14 * s, 7);
    for (let k = 0; k < 4; k++) { const g = new THREE.ConeGeometry((1.7 - k * 0.32) * s, 2.0 * s, 8); put('site', M.leaf, g, new THREE.Matrix4().makeTranslation(x, y + (2.2 + k * 1.05) * s, z)); }
    return;
  }
  cyl('site', M.bark, V3(x, y, z), V3(x, y + 2.6 * s, z), 0.15 * s, 7);
  for (const [a, b, c, r] of [[0, 3.3, 0, 1.55], [0.75, 2.75, 0.3, 1.1], [-0.65, 2.85, -0.3, 1.15], [0.1, 4.2, 0, 1.0]]) {
    const g = new THREE.IcosahedronGeometry(r * s, 0); put('site', kind === 'claro' ? M.leaf2 : M.leaf, g, new THREE.Matrix4().makeTranslation(x + a * s, y + b * s, z + c * s));
  }
}
function bush(x, z, r) { const g = new THREE.IcosahedronGeometry(r, 1); g.scale(1, 0.72, 1); put('site', M.leaf2, g, new THREE.Matrix4().makeTranslation(x, groundAt(x, z) + r * 0.5, z)); }
function scatterTrees(seed, rMin, rMax, count, kinds, avoid) {
  const r = rng(seed);
  let placed = 0, tries = 0;
  while (placed < count && tries < count * 20) {
    tries++;
    const ang = r() * Math.PI * 2, rad = rMin + r() * (rMax - rMin);
    const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
    if (avoid && avoid(x, z)) continue;
    tree(x, z, 0.8 + r() * 0.6, kinds[Math.floor(r() * kinds.length)]);
    placed++;
  }
}
/* árvores fora da frente, da lateral direita e do cone da câmera 3D */
const frontClear = (x, z) => {
  if (z > 1 && Math.abs(x) < 7 + z * 0.9) return true;
  if (x > 1 && Math.abs(z) < 7 + x * 0.9) return true;
  const a = -0.527 * x + 0.85 * z, b = Math.abs(0.85 * x + 0.527 * z);
  return a > 0 && b < 5 + a * 0.8;
};

    <section class="price"><h2>Valor total</h2><p class="big">${valor(m)}</p>${PRECO[m.id][1] ? `<p class="note">${PRECO[m.id][1]}</p>` : ''}${PUBLIC ? `<a class="wa" href="https://wa.me/${WA}?text=${encodeURIComponent('Olá! Vi no site o modelo ' + m.id + ' · ' + m.name + ' e quero um orçamento.')}" target="_blank" rel="noopener">Pedir orçamento deste modelo</a>` : ''}</section>
    <section><h2>Na coleção</h2><div class="tags"><span>Padrão <b>${'●'.repeat(m.lv)}${'○'.repeat(4 - m.lv)}</b> ${m.nivel}</span><span>Entrega: ${f.entrega}</span><span>Execução: ${f.execucao}</span></div></section>
    <section><h2>Uso e terreno</h2><p class="idea">${f.uso}</p></section>
    <section><h2>Diferencial</h2><p class="idea">${f.diferencial}</p></section>
    ${PUBLIC ? '' : `<section><h2>De onde veio</h2><p class="idea">${f.origem}</p></section>`}
    <p class="note">${PUBLIC ? 'Imagens ilustrativas. Medidas, materiais e valor final são fechados no orçamento. Estrutura e fundação seguem projeto com ART de engenheiro.' : 'Estudo de visualização com as bitolas da sua prática. Estrutura e fundação passam pelo projeto e pela ART do engenheiro antes da obra.'}</p>`;
}
function fitSun(bb) {
  const c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length() / 2 + 2;
  sun.position.set(c.x - 0.55 * r * 1.6, c.y + r * 1.9, c.z + 0.7 * r * 1.6);
  sun.target.position.copy(c);
  sun.target.updateMatrixWorld();
  Object.assign(sun.shadow.camera, { left: -r * 1.2, right: r * 1.2, top: r * 1.2, bottom: -r * 1.2, near: 0.5, far: r * 6 });
  sun.shadow.camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;
}
function select(id) {
  const m = byId[id] || MODELS[0];
  teardown();
  ROOT = new THREE.Group(); G = {};
  for (const k of GROUPS) { G[k] = new THREE.Group(); ROOT.add(G[k]); }
  resetPlan();
  LREQ = [];
  m.build();
  flush();
  placeLights();
  scene.add(ROOT);
  current = m;
  lastInGroup[m.g] = m.id;
  applyLayers();
  fitSun(modelBox());
  $('#mName').textContent = `${m.id} · ${m.name}`;
  $('#mMeta').innerHTML = `${dots(m.lv)}<span>${m.nivel}</span><span class="num">${m.size}</span><span class="num">${m.area}</span><span class="num val">${valor(m)}</span>`;
  $('#pTitle').textContent = `${m.id} · ${m.name}`;
  renderChips(m.g);
  renderSheet(m);
  planBody.innerHTML = planSVG();
  setView(view === 'dentro' ? '3d' : view, true);
  if (location.hash.slice(1).toLowerCase() !== m.id.toLowerCase()) location.hash = m.id.toLowerCase();
}
let tw = null;
/* área livre entre a barra de cima e a de baixo: o modelo é enquadrado nela */
function uiPad() {
  const h = stage.clientHeight || innerHeight;
  const t = Math.min(h * 0.4, document.querySelector('.top').getBoundingClientRect().bottom);
  const b = Math.min(h * 0.4, h - document.querySelector('.bottom .rows').getBoundingClientRect().top);
  return { t, b, h, avail: Math.max(120, h - t - b) };
}
function applyOffset() {
  const w = stage.clientWidth || innerWidth, { t, b, h } = uiPad();
  persp.setViewOffset(w, h, 0, -(t - b) / 2, w, h);
  if (camera === ortho && ortho.userData.half) {
    const half = ortho.userData.half, sh = ((t - b) / 2) * (2 * half / h);
    Object.assign(ortho, { left: -half * w / h, right: half * w / h, top: half + sh, bottom: -half + sh });
    ortho.updateProjectionMatrix();
  }
}
/* fachadas: sem árvores nem névoa, fundo liso e o perfil do terreno em corte */
const FOG = scene.fog, ELEV_BG = new THREE.Color(0xeceee8);
const elevMat = new THREE.MeshBasicMaterial({ color: 0x8b7f6a, fog: false });
let elev = null;
function setElevation(v, bb) {
  const on = v === 'frente' || v === 'lateral';
  if (elev) { scene.remove(elev); elev.geometry.dispose(); elev = null; }
  if (G.site) G.site.visible = !on;
  ground.visible = farGround.visible = !on;
  FOG.near = on ? 1e4 : 60; FOG.far = on ? 2e4 : 210;
  scene.background = on ? ELEV_BG : skyT;
  if (!on) return;
  const front = v === 'frente', plane = (front ? bb.max.z : bb.max.x) + 0.25, pts = [];
  const gy = (s) => (front ? groundAt(s, plane) : groundAt(plane, -s));
  for (let s = -60; s <= 60.01; s += 0.5) pts.push(new THREE.Vector2(s, gy(s)));
  for (let s = 60; s >= -60.01; s -= 0.5) pts.push(new THREE.Vector2(s, gy(s) - 0.32));
  elev = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), elevMat);
  if (front) elev.position.z = plane; else { elev.rotation.y = Math.PI / 2; elev.position.x = plane; }
  scene.add(elev);
}
const FOV3D = 40, FOVIN = 68;
function setView(v, instant) {
  view = v;
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === v));
  planEl.hidden = v !== 'planta';
  if (v === 'planta') return;
  const bb = modelBox(), c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  const w = stage.clientWidth || innerWidth, { h, avail } = uiPad();
  setElevation(v, bb);
  applyLayers();
  if (v === 'frente' || v === 'lateral') {
    camera = ortho; ctlP.enabled = false; ctlO.enabled = true; ctl = ctlO;
    const span = v === 'frente' ? sz.x : sz.z;
    const needH = Math.max(sz.y * 1.18, (span * 1.12) * avail / w) + 0.3;
    ortho.userData.half = (needH / 2) * (h / avail);
    ortho.zoom = 1;
    const t = V3(c.x, bb.min.y + sz.y * 0.5, c.z);
    ortho.position.copy(t).add(v === 'frente' ? V3(0, 0, 80) : V3(80, 0, 0));
    ctlO.target.copy(t); ortho.lookAt(t);
    applyOffset();
    ctlO.update();
    tw = null;
    return;
  }
  camera = persp; ctlO.enabled = false; ctlP.enabled = true; ctl = ctlP;
  applyOffset();
  let p1, t1;
  if (v === 'dentro') {
    p1 = V3(...current.dentro.p); t1 = V3(...current.dentro.t);
    ctlP.minDistance = 0.05;
  } else {
    ctlP.minDistance = 1.2;
    const r = sz.length() / 2;
    const vf = Math.atan(Math.tan(THREE.MathUtils.degToRad(FOV3D) / 2) * avail / h);
    const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(FOV3D) / 2) * w / h);
    const dist = (r / Math.sin(Math.min(vf, hf))) * 0.94;
    t1 = V3(c.x, bb.min.y + sz.y * 0.42, c.z);
    p1 = t1.clone().add(V3(-0.62, 0.38, 1).normalize().multiplyScalar(dist));
  }
  const f1 = v === 'dentro' ? FOVIN : FOV3D;
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { persp.fov = f1; persp.updateProjectionMatrix(); persp.position.copy(p1); ctlP.target.copy(t1); tw = null; ctlP.update(); return; }
  tw = { p0: persp.position.clone(), t0: ctlP.target.clone(), p1, t1, f0: persp.fov, f1, s: performance.now() };
}
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => { hint.classList.add('gone'); setView(b.dataset.view); });
for (const b of document.querySelectorAll('[data-layer]')) b.addEventListener('click', () => { const k = b.dataset.layer; layers[k] = !layers[k]; applyLayers(); });
for (const b of document.querySelectorAll('#groups button')) b.addEventListener('click', () => select(lastInGroup[b.dataset.g]));
const fichaBtn = $('#fichaBtn');
fichaBtn.addEventListener('click', () => { const on = sheet.hidden; sheet.hidden = !on; fichaBtn.setAttribute('aria-expanded', String(on)); });
renderer.domElement.addEventListener('pointerdown', () => hint.classList.add('gone'), { once: true });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).toUpperCase(); if (byId[id] && (!current || current.id !== id)) select(id); });

function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  persp.aspect = w / h;
  persp.updateProjectionMatrix();
  applyOffset();
}
window.addEventListener('resize', resize);
resize();

const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function loop(now) {
  requestAnimationFrame(loop);
  if (tw) {
    const k = Math.min(1, (now - tw.s) / 900), e = ease(k);
    persp.position.lerpVectors(tw.p0, tw.p1, e); ctlP.target.lerpVectors(tw.t0, tw.t1, e);
    if (tw.f0 !== tw.f1) { persp.fov = tw.f0 + (tw.f1 - tw.f0) * e; persp.updateProjectionMatrix(); }
    if (k === 1) tw = null;
  }
  ctl.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
try {
  select((location.hash.slice(1) || 'A1').toUpperCase());
  loading.hidden = true;
} catch (e) {
  console.error(e);
  fail('Não consegui montar o modelo: ' + e.message);
}
requestAnimationFrame(loop);
</script>
